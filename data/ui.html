<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>FINUX Assistant</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
}

header {
  background: #1f2937;
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 20px;
  position: relative;
}

#logout {
  position: absolute;
  right: 10px;
  top: 10px;
  background: #ef4444;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
}

#chat {
  padding: 15px;
  height: calc(100vh - 140px);
  overflow-y: auto;
}

.message {
  max-width: 75%;
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 8px;
  line-height: 1.4;
}

.user {
  background: #2563eb;
  color: white;
  margin-left: auto;
}

.bot {
  background: white;
  border: 1px solid #ddd;
}

#typing {
  display: none;
  padding: 10px;
  font-style: italic;
  color: gray;
}

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  padding: 10px;
  display: flex;
  border-top: 1px solid #ddd;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

#container {
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 250px;
  background: #111827;
  color: white;
  padding: 10px;
}

#sidebar button {
  width: 100%;
  margin-bottom: 10px;
  background: #2563eb;
}

#history div {
  padding: 8px;
  margin: 5px 0;
  background: #1f2937;
  cursor: pointer;
  border-radius: 5px;
}

#history div:hover {
  background: #374151;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

</style>
</head>

<body>

<div id="container">

  <!-- 🧾 SIDEBAR -->
  <div id="sidebar">
    <h3>💬 Chats</h3>
    <button onclick="newChat()">+ New Chat</button>
    <div id="history"></div>
  </div>

  <!-- 💬 MAIN -->
  <div id="main">

    <header id="header">
      <span id="title">🤖 FINUX Assistant</span>
      <button id="logout" onclick="logout()">Logout</button>
    </header>

    <div id="chat"></div>

    <div id="typing">Bot is typing...</div>

    <footer>
      <input id="input" placeholder="Ask about FINUX..." 
             onkeydown="if(event.key==='Enter'){send();}" />
      <button onclick="send()">Send</button>
    </footer>

  </div>

</div>


<script>

let currentChat = [];

function getUsernameFromToken() {
  const token = localStorage.getItem("token");

  if (!token) return null;

  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    return payload.sub;
  } catch (e) {
    return null;
  }
}

function showUser() {
  const username = getUsernameFromToken();

  if (username) {
    document.getElementById("title").innerText =
      "🤖 FINUX Assistant | 👤 " + username;
  }
}

// 🔐 Check login
let token = localStorage.getItem("token");

if (!token) {
  window.location.href = "/login";
}

// 🔓 Logout
function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login";
}

// 💬 Add message
function add(text, cls) {
  let div = document.createElement("div");
  div.className = "message " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = chat.scrollHeight;
}

// 🚀 Send message
async function send() {
  let input = document.getElementById("input");
  let text = input.value.trim();
  if (!text) return;

  add(text, "user");
  input.value = "";

  document.getElementById("typing").style.display = "block";

  try {
    let res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ message: text })
    });

    let data = await res.json();

    document.getElementById("typing").style.display = "none";

    // ✅ show bot message
    add(data.response || "No response", "bot");

    // ✅ ADD THIS PART HERE 👇
    currentChat.push({ role: "user", text: text });
    currentChat.push({ role: "bot", text: data.response });

    
  } catch (e) {
    document.getElementById("typing").style.display = "none";
    add("Server error.", "bot");
  }
}

// 🆕 Start new chat
function newChat() {
  currentChat = [];
  document.getElementById("chat").innerHTML = "";

  // 🔥 reload sidebar/history from DB
  loadHistory();
}

// 📜 Load sidebar history
async function loadHistory() {
  const token = localStorage.getItem("token");

  if (!token) return;

  const res = await fetch("/history", {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();

  console.log("HISTORY DATA:", data); // ✅ DEBUG

  currentChat = [];
  document.getElementById("chat").innerHTML = "";

  data.forEach(item => {
    add(item.question, "user");
    add(item.answer, "bot");

    currentChat.push({ role: "user", text: item.question });
    currentChat.push({ role: "bot", text: item.answer });
  });
}

// 🖥 Render selected chat
function renderChat() {
  let chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";

  currentChat.forEach(msg => {
    add(msg.text, msg.role === "user" ? "user" : "bot");
  });
}

showUser();
window.onload = loadHistory;
</script>

</body>
</html>
