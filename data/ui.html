<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>FINUX Assistant</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
}

header {
  background: #1f2937;
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 20px;
  position: relative;
}

#logout {
  position: absolute;
  right: 10px;
  top: 10px;
  background: #ef4444;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
}

#chat {
  padding: 15px;
  height: calc(100vh - 140px);
  overflow-y: auto;
}

.message {
  max-width: 75%;
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 8px;
  line-height: 1.4;
}

.user {
  background: #2563eb;
  color: white;
  margin-left: auto;
}

.bot {
  background: white;
  border: 1px solid #ddd;
}

#typing {
  display: none;
  padding: 10px;
  font-style: italic;
  color: gray;
}

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  padding: 10px;
  display: flex;
  border-top: 1px solid #ddd;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

#container {
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 250px;
  background: #111827;
  color: white;
  padding: 10px;
}

#sidebar button {
  width: 100%;
  margin-bottom: 10px;
  background: #2563eb;
}

#history div {
  padding: 8px;
  margin: 5px 0;
  background: #1f2937;
  cursor: pointer;
  border-radius: 5px;
}

#history div:hover {
  background: #374151;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

</style>
</head>

<body style="display:none;">

<div id="container">

  <!-- 🧾 SIDEBAR -->
  <div id="sidebar">
    <h3>💬 Chats</h3>
    <button onclick="newChat()">+ New Chat</button>
    <div id="history"></div>
  </div>

  <!-- 💬 MAIN -->
  <div id="main">

    <header id="header">
      <span id="title">🤖 FINUX Assistant</span>
      <button id="logout" onclick="logout()">Logout</button>
      <button id="adminBtn" onclick="showAdmin()" style="display:none;">
  ⚙ Admin Panel
</button>
    </header>

    <div id="chat"></div>

    <div id="typing">Bot is typing...</div>

    <footer>
      <input id="input" placeholder="Ask me..." 
             onkeydown="if(event.key==='Enter'){send();}" />
      <button onclick="send()">Send</button>
    </footer>

  </div>

</div>


<script>

const authToken = localStorage.getItem("token");

if (!authToken) {
  window.location.replace("/login");
} else {
  document.body.style.display = "block";
}

let currentChat = [];
let currentSession = null;

async function checkAdmin() {
  const token = localStorage.getItem("token");

  const res = await fetch("/me", {
    headers: { "Authorization": "Bearer " + token }
  });

  const data = await res.json();

  if (data.role === "admin") {
    document.getElementById("adminBtn").style.display = "block";
  }
}

function getUsernameFromToken() {
  const token = localStorage.getItem("token");

  if (!token) return null;

  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    return payload.sub;
  } catch (e) {
    return null;
  }
}

function showUser() {
  const username = getUsernameFromToken();

  if (username) {
    document.getElementById("title").innerText =
      "🤖 FINUX Assistant | Hello " + username;
  }
}

// 🔓 Logout
function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login";
}

// 💬 Add message
function add(text, cls) {
  let div = document.createElement("div");
  div.className = "message " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = chat.scrollHeight;
}

function showWelcome() {
  const chatDiv = document.getElementById("chat");

  chatDiv.innerHTML = `
    <div style="text-align:center; margin-top: 100px; color: #6b7280;">
      
      <p style="font-size: 18px;">What's on your mind today?</p>
      <p style="font-size: 14px;">Ask me anything 🚀</p>
    </div>
  `;
}

async function showAdmin() {
  const token = localStorage.getItem("token");

  const res = await fetch("/admin/menus", {
    headers: { "Authorization": "Bearer " + token }
  });

  const menus = await res.json();

  let html = `<h3>📋 Manage Menus</h3>`;

  if (menus.length === 0) {
    html += `<p>No menus found</p>`;
  }

  menus.forEach(m => {
    html += `
      <div style="margin-bottom:10px;">
        <b>${m.label}</b> (${m.parent})
        <button onclick="deleteMenu('${m.label}', '${m.key}')">❌ Delete</button>
      </div>
    `;
  });

  html += `<hr><button onclick="showAddForm()">➕ Add New</button>`;

  document.getElementById("chat").innerHTML = html;
}

async function deleteMenu(label, key) {
  const token = localStorage.getItem("token");

  if (!confirm("Delete this menu?")) return;

  const res = await fetch("/admin/delete-menu", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ label, key })
  });

  const result = await res.json();

  alert(result.message || result.error);

  showAdmin(); // 🔥 refresh list
}

async function submitAdmin() {
  const token = localStorage.getItem("token");

  const data = {
    label: document.getElementById("label").value,
    key: document.getElementById("key").value,
    parent: document.getElementById("parent").value,
    answer: document.getElementById("answer").value
  };

  const res = await fetch("/admin/add-full", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  alert(result.message || result.error);
}

function showAddForm() {
  document.getElementById("chat").innerHTML = `
    <h3>➕ Add Menu</h3>

    <input id="label" placeholder="Menu Label"><br><br>
    <input id="key" placeholder="Answer Key"><br><br>
    <input id="parent" placeholder="Parent (main / wallet / others)"><br><br>
    <textarea id="answer" placeholder="Answer"></textarea><br><br>

    <button onclick="submitAdmin()">Save</button>
    <button onclick="showAdmin()">⬅ Back</button>
  `;
}

// 🚀 Send message
async function send() {
  const token = localStorage.getItem("token");
  let input = document.getElementById("input");
  let text = input.value.trim();
  if (!text) return;

  add(text, "user");
  input.value = "";

  document.getElementById("typing").style.display = "block";

  try {
    if (!currentSession) {
  currentSession = "session_" + Date.now();
}
    let res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ message: text, session_id: currentSession })
    });

    let data = await res.json();

    document.getElementById("typing").style.display = "none";

    // ✅ show bot message
    add(data.response || "No response", "bot");
    loadSessions();

    
    currentChat.push({ role: "user", text: text });
    currentChat.push({ role: "bot", text: data.response });

    
  } catch (e) {
    document.getElementById("typing").style.display = "none";
    add("Server error.", "bot");
  }
}

// 🆕 Start new chat
function newChat() {
  currentSession = "session_" + Date.now();
  currentChat = [];

  showWelcome();
}

async function loadSessionChat(sessionId) {
  const token = localStorage.getItem("token");

  const res = await fetch("/session/" + sessionId, {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();

  currentSession = sessionId;
  currentChat = [];

  document.getElementById("chat").innerHTML = "";

  data.forEach(item => {
    add(item.q, "user");
    add(item.a, "bot");
  });
}

// 📜 Load sidebar history
async function loadSessions() {
  const token = localStorage.getItem("token");

  const res = await fetch("/sessions", {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const sessions = await res.json();

  let historyDiv = document.getElementById("history");
  historyDiv.innerHTML = "";

  sessions.forEach(s => {
    let div = document.createElement("div");

    div.innerText = s.title;   // 🔥 show first question
    div.style.cursor = "pointer";

    div.onclick = () => loadSessionChat(s.session_id);

    historyDiv.appendChild(div);
  });
}

// 🖥 Render selected chat
function renderChat() {
  let chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";

  currentChat.forEach(msg => {
    add(msg.text, msg.role === "user" ? "user" : "bot");
  });
}

window.onload = function () {
  showUser();
  loadSessions();
  showWelcome();
  checkAdmin();
};

</script>

</body>
</html>
